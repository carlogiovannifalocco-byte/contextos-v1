services:
  postgres:
    image: postgres:16-alpine
    container_name: contextos-postgres
    environment:
      POSTGRES_USER: contextos
      POSTGRES_PASSWORD: contextos
      POSTGRES_DB: contextos
    ports:
      - "5432:5432"
    volumes:
      - contextos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextos -d contextos"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  contextos_pgdata:
