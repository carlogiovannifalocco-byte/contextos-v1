name: Bug report
description: Something is broken in ContextOS
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. npm run dev\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0-beta
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Local Node dev
        - Docker compose prod
        - CI
        - Other
