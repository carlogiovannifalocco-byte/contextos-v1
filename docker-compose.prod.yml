# Auth is locked: compose interpolation fails if COOKIE_SECRET is unset.
# API also refuse-closed in scripts/prod-start.mjs (length + placeholder check).
# SQL migrations: prisma migrate deploy on API start (not db push).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contextos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextos}
      POSTGRES_DB: contextos
    volumes:
      - contextos_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextos -d contextos"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    hostname: api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://contextos:${POSTGRES_PASSWORD:-contextos}@postgres:5432/contextos
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set to 32+ characters}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

volumes:
  contextos_prod_pgdata:
